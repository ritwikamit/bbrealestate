    <line x1="216" y1="226" x2="228" y2="216" stroke="#FFFBEB" stroke-width="0.8" opacity="0.6" />
    <line x1="216" y1="241" x2="228" y2="231" stroke="#FFFBEB" stroke-width="0.8" opacity="0.6" />

